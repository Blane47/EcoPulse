name: CI

on:
  push:
  pull_request:

jobs:
  api:
    name: API tests
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s --health-timeout 5s --health-retries 12
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      # Seeds a throwaway ecopulse_test database, starts the API and runs every suite
      - run: npm test
        env:
          TEST_MONGODB_URI: mongodb://127.0.0.1:27017/ecopulse_test

  dashboard:
    name: Dashboard lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  mobile:
    name: Mobile apps — undefined names
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      # The check uses the dashboard's ESLint (see eslint.mobile.config.mjs)
      - run: npm ci
        working-directory: client
      - run: node client/node_modules/eslint/bin/eslint.js --no-config-lookup -c eslint.mobile.config.mjs collector community
